<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Juejin hot board data cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="220" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="120" cy="590" r="180" fill="#0ea5e9" opacity="0.12"/>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="72" y="62" width="128" height="36" rx="18" fill="#1e40af"/>
    <text x="136" y="87" fill="#bfdbfe" font-size="18" text-anchor="middle" letter-spacing="2">DATA</text>

    <text x="72" y="172" fill="#f8fafc" font-size="62" font-weight="700">50 ARTICLES</text>
    <text x="72" y="238" fill="#93c5fd" font-size="30" letter-spacing="1">JUEJIN 3-DAY HOT BOARD</text>

    <line x1="72" y1="278" x2="560" y2="278" stroke="#3b82f6" stroke-width="3"/>

    <text x="72" y="360" fill="#ffffff" font-size="76" font-weight="700">1 like</text>
    <text x="330" y="360" fill="#38bdf8" font-size="76" font-weight="700">=</text>
    <text x="392" y="360" fill="#ffffff" font-size="76" font-weight="700">20 views</text>
    <text x="72" y="410" fill="#94a3b8" font-size="24">hot_index = 9 x round(views/20 + likes + comments)</text>

    <g transform="translate(72 470)">
      <rect x="0"   y="0" width="180" height="14" rx="7" fill="url(#bar)"/>
      <rect x="196" y="0" width="180" height="14" rx="7" fill="#334155"/>
      <rect x="392" y="0" width="180" height="14" rx="7" fill="#334155"/>
      <text x="0"   y="44" fill="#cbd5e1" font-size="19">likes / comments</text>
      <text x="196" y="44" fill="#64748b" font-size="19">views</text>
      <text x="392" y="44" fill="#64748b" font-size="19">collects</text>
    </g>

    <text x="72" y="586" fill="#64748b" font-size="20">snapshot 2026-11-06  /  standard agent skill</text>
    <text x="1128" y="586" fill="#64748b" font-size="20" text-anchor="end">MIT</text>
  </g>
</svg>
